  <!-- Styles -->
  <style
     id="style1">&#10;    .box {&#10;    fill: #f7f7f7;&#10;    stroke: #333333;&#10;    stroke-width: 1.5;&#10;    rx: 6;&#10;    ry: 6;&#10;    }&#10;    .title {&#10;    font-family: Arial, sans-serif;&#10;    font-size: 14px;&#10;    font-weight: bold;&#10;    fill: #111111;&#10;    text-anchor: middle;&#10;    }&#10;    .text {&#10;    font-family: Arial, sans-serif;&#10;    font-size: 12px;&#10;    fill: #333333;&#10;    text-anchor: middle;&#10;    }&#10;    .arrow {&#10;    stroke: #333333;&#10;    stroke-width: 1.5;&#10;    marker-end: url(#arrowhead);&#10;    }&#10;    .note {&#10;    font-family: Arial, sans-serif;&#10;    font-size: 11px;&#10;    fill: #555555;&#10;    text-anchor: middle;&#10;    }&#10;  </style>
  <!-- Arrowhead marker -->
  <defs
     id="defs1">
    <marker
       id="arrowhead"
       markerWidth="8"
       markerHeight="8"
       refX="4"
       refY="4"
       orient="auto"
       markerUnits="strokeWidth">
      <polygon
         points="0,8 0,0 8,4"
         fill="#333333"
         id="polygon1" />
    </marker>
  </defs>
  <!-- 1. Sentinel-2 Input -->
  <rect
     x="46"
     y="20"
     width="400"
     height="70"
     class="box"
     id="rect1" />
  <text
     x="246"
     y="45"
     class="title"
     id="text1">Sentinel‑2 Input Image</text>
  <text
     x="246"
     y="65"
     class="text"
     id="text2">(10 m / 20 m resolution, incl. SWIR)</text>
  <!-- Arrow 1 -->
  <line
     x1="246"
     y1="90"
     x2="246"
     y2="120"
     class="arrow"
     id="line2" />
  <!-- 2. Feature Extraction -->
  <rect
     x="46"
     y="120"
     width="400"
     height="90"
     class="box"
     id="rect2" />
  <text
     x="246"
     y="145"
     class="title"
     id="text3">1. Feature Extraction</text>
  <text
     x="246"
     y="165"
     class="text"
     id="text4">The model analyzes spatial and spectral patterns</text>
  <text
     x="246"
     y="183"
     class="text"
     id="text5">(edges, textures, gradients, etc.).</text>
  <!-- Arrow 2 -->
  <line
     x1="246"
     y1="210"
     x2="246"
     y2="240"
     class="arrow"
     id="line5" />
  <!-- 3. Detail Reconstruction -->
  <rect
     x="46"
     y="240"
     width="400"
     height="110"
     class="box"
     id="rect5" />
  <text
     x="246"
     y="265"
     class="title"
     id="text6">2. Detail Reconstruction</text>
  <text
     x="246"
     y="285"
     class="text"
     id="text7">Using Sentinel‑2 ↔ VENµS training pairs,</text>
  <text
     x="246"
     y="303"
     class="text"
     id="text8">the model predicts fine‑scale 5 m structures</text>
  <text
     x="246"
     y="321"
     class="text"
     id="text9">inside each low‑resolution pixel.</text>
  <!-- Arrow 3 -->
  <line
     x1="246"
     y1="350"
     x2="246"
     y2="380"
     class="arrow"
     id="line9" />
  <!-- 4. Upsampling -->
  <rect
     x="46"
     y="380"
     width="400"
     height="90"
     class="box"
     id="rect9" />
  <text
     x="246"
     y="405"
     class="title"
     id="text10">3. Upsampling</text>
  <text
     x="246"
     y="425"
     class="text"
     id="text11">Learned upsampling layers convert features</text>
  <text
     x="246"
     y="443"
     class="text"
     id="text12">into a full 5 m reflectance image.</text>
  <!-- Arrow 4 -->
  <line
     x1="246"
     y1="470"
     x2="246"
     y2="500"
     class="arrow"
     id="line12" />
  <!-- 5. Output -->
  <rect
     x="46.161625"
     y="500.16162"
     width="399.67676"
     height="103.50454"
     class="box"
     id="rect12" />
  <text
     x="246"
     y="525"
     class="title"
     id="text13">5 m Super‑Resolved Reflectance Output</text>
  <text
     x="246"
     y="545"
     class="text"
     id="text14">(VIS, red‑edge, NIR supervised by VENµS)</text>
  <!-- SWIR note -->
  <text
     x="246"
     y="575"
     class="note"
     id="text15">&#10;    SWIR (B11, B12): 5 m output constrained by Wald protocol,&#10;  </text>
  <text
     x="246"
     y="591"
     class="note"
     id="text16">&#10;    consistent with 20 m Sentinel‑2 SWIR (no 5 m SWIR reference).&#10;  </text>
</svg>
